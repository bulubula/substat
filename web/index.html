<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substat 状态监控</title>
  <base href="{{.BasePath}}/">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="logo">⚡</span>
        <h1>Substat</h1>
      </div>
      <div class="header-right">
        <div class="theme-switcher">
          <button class="theme-btn" data-theme-val="light" title="白天模式">☀️ 白天</button>
          <button class="theme-btn" data-theme-val="dark" title="夜间模式">🌙 夜晚</button>
          <button class="theme-btn active" data-theme-val="auto" title="跟随系统">🖥️ 自动</button>
        </div>
        <div class="meta-tag">v0.2.1</div>
      </div>
    </header>

    <main>
      <div id="monitors" class="grid">
        <div class="loading">正在加载监控服务状态...</div>
      </div>
    </main>

    <footer>
      <span>Substat Monitor &bull; 自动轮询刷新</span>
    </footer>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
